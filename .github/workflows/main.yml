name: Cloud Compile Legacy Binaries
on: [workflow_dispatch]

jobs:
  build-gta:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Fetch Dependencies
        run: |
          cd examples/minecraft-gta5-passthrough/gta
          chmod +x fetch_deps.sh
          ./fetch_deps.sh
        shell: bash

      - name: Compile GTA Binary
        run: |
          cd examples/minecraft-gta5-passthrough/gta
          .\build.bat
        shell: cmd

      - name: Upload ASI Binary
        uses: actions/upload-artifact@v4
        with:
          name: gta5-legacy-asi
          path: examples/minecraft-gta5-passthrough/gta/build/MCPassthrough.asi

  build-minecraft:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # Upgraded to Java 25 to satisfy the fabric-loom dependencies
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Compile Fabric Jar
        run: |
          cd examples/minecraft-gta5-passthrough/mc
          chmod +x gradlew
          ./gradlew build

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-legacy-jar
          path: |
            examples/minecraft-gta5-passthrough/mc/build/libs/*.jar
            !examples/minecraft-gta5-passthrough/mc/build/libs/*-plain.jar
            !examples/minecraft-gta5-passthrough/mc/build/libs/*-sources.jar
