name: Cloud Compile Legacy Binaries
on: [workflow_dispatch]

jobs:
  build-gta:
    runs-on: windows-latest  # Kept on Windows
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Runs your bash script using Windows' built-in Git Bash environment
      - name: Fetch Dependencies
        run: |
          cd examples/minecraft-gta5-passthrough/gta
          chmod +x fetch_deps.sh
          ./fetch_deps.sh
        shell: bash

      # Runs your batch file inside the standard Windows Command Prompt
      - name: Compile GTA Binary
        run: |
          cd examples/minecraft-gta5-passthrough/gta
          .\build.bat
        shell: cmd

      - name: Upload ASI Binary
        uses: actions/upload-artifact@v4
        with:
          name: gta5-legacy-asi
          path: examples/minecraft-gta5-passthrough/gta/build/MCPassthrough.asi

  build-minecraft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Fabric Jar
        run: |
          cd examples/minecraft-gta5-passthrough/mc
          chmod +x build.sh
          ./build.sh

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-legacy-jar
          path: |
            examples/minecraft-gta5-passthrough/mc/build/libs/*.jar
            !examples/minecraft-gta5-passthrough/mc/build/libs/*-plain.jar
            !examples/minecraft-gta5-passthrough/mc/build/libs/*-sources.jar
